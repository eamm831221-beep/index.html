            <h3>DATOS DE LA PERSONA ENTREVISTADA</h3>
            
            <div class="form-group">
                <label for="nombre">3. Nombre</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label for="apellido_paterno">4. Apellido paterno</label>
                <input type="text" id="apellido_paterno" required>
            </div>
            <div class="form-group">
                <label for="apellido_materno">5. Apellido materno</label>
                <input type="text" id="apellido_materno" required>
            </div>
            <div class="form-group">
                <label for="telefono">6. Teléfono</label>
                <input type="tel" id="telefono" pattern="[0-9]{10}" placeholder="10 dígitos" required>
            </div>

            <div class="form-group">
                <label>7. Sexo</label>
                <div class="radio-tile-group">
                    <label class="radio-tile">
                        <input type="radio" name="sexo" value="Hombre" required>
                        <span class="radio-label">Hombre</span>
                    </label>
                    <label class="radio-tile">
                        <input type="radio" name="sexo" value="Mujer">
                        <span class="radio-label">Mujer</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>8. Grupo de edad</label>
                <div class="radio-tile-group vertical">
                    <label class="radio-tile">
                        <input type="radio" name="grupo_edad" value="Joven de 15 a 29 años" required>
                        <span class="radio-label">Joven de 15 a 29 años</span>
                    </label>
                    <label class="radio-tile">
                        <input type="radio" name="grupo_edad" value="Adulto de 30 a 64 años">
                        <span class="radio-label">Adulto de 30 a 64 años</span>
                    </label>
                    <label class="radio-tile">
                        <input type="radio" name="grupo_edad" value="Adulto Mayor de 65 años">
                        <span class="radio-label">Adulto Mayor de 65 años</span>
                    </label>
                </div>
            </div>
            <h3>DOMICILIO</h3>

            <div class="form-group">
                <label for="domicilio">9. Calle, Numero, Colonia</label>
                <textarea id="domicilio" rows="4" placeholder="Gran cantidad de texto..." required></textarea>
            </div>
            <div class="form-group">
                <label for="localidad">10. Localidad</label>
                <input type="text" id="localidad" required>
            </div>
            <div class="form-group">
                <label for="zona">11. Zona</label>
                <input type="text" id="zona" pattern="[0-9]{3}" maxlength="3" placeholder="3 dígitos (Ej. 045)" required>
            </div>
            <div class="form-group">
                <label for="seccion">12. Sección</label>
                <input type="text" id="seccion" pattern="[0-9]{4}" maxlength="4" placeholder="4 dígitos (Ej. 1205)" required>
            </div>

            <div class="form-group">
                <label for="programa">13. Programa al que pertenece</label>
                <select id="programa" required>
                    <option value="">Selecciona un programa...</option>
                    <option value="Adulto Mayor">Adulto Mayor</option>
                    <option value="Discapacidad">Discapacidad</option>
                    <option value="Mujeres Bienestar">Mujeres Bienestar</option>
                    <option value="Beca Benito Juarez">Beca Benito Juarez</option>
                    <option value="Beca Rita Cetina">Beca Rita Cetina</option>
                    <option value="Jovenes Construyendo el Futuro">Jovenes Construyendo el Futuro</option>
                    <option value="Boxeando por la Paz">Boxeando por la Paz</option>
                    <option value="Ninguno">Ninguno</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="recepcion">14. ¿Cómo califica la recepción del mensaje?</label>
                <select id="recepcion" required>
                    <option value="">Selecciona una opción...</option>
                    <option value="Excelente">Excelente</option>
                    <option value="Bueno">Bueno</option>
                    <option value="Regular">Regular</option>
                    <option value="Mala">Mala</option>
                    <option value="Muy mala">Muy mala</option>
                </select>
            </div>

            <div class="form-group">
                <label for="problematica">15. Problemática detectada</label>
                <select id="problematica" required>
                    <option value="">Selecciona una opción...</option>
                    <option value="AGUA">AGUA</option>
                    <option value="ELECTRICIDAD">ELECTRICIDAD</option>
                    <option value="VIVIENDA">VIVIENDA</option>
                    <option value="SALUD">SALUD</option>
                    <option value="EDUCACION">EDUCACION</option>
                    <option value="TRANSPORTE">TRANSPORTE</option>
                    <option value="SERVICIOS PUBLICOS">SERVICIOS PUBLICOS</option>
                    <option value="MEDIO AMBIENTE">MEDIO AMBIENTE</option>
                    <option value="PROGRAMAS SOCIALES">PROGRAMAS SOCIALES</option>
                    <option value="TRAMITES">TRAMITES</option>
                    <option value="OTRO">OTRO</option>
                </select>
            </div>

            <div class="form-group">
                <label for="observacion">16. OBSERVACION/INCIDENCIA</label>
                <textarea id="observacion" rows="4" placeholder="Texto abierto para registrar cualquier situación..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Guardar Registro en Campo</button>
        </form>
    </div>
